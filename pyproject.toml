[project]
name = "maintenance-assistant"
version = "0.1.0"
description = "Assistant intelligent de support informatique — hackathon ISPM mAIntenance & Assistance"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "google-genai",
    "chromadb",
    "sentence-transformers",
    "streamlit",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Sans ce réglage, ruff ne reconnaît plus `src` comme premier-parti depuis la
# restructuration `backend/` : il fusionne son groupe d'imports avec les
# bibliothèques tierces, et `ruff check` échoue sur tous les fichiers de test.
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# Les tests touchant le réseau (quota Gemini limité) sont désactivés par
# défaut : `pytest -m reseau` pour les lancer explicitement.
markers = [
    "reseau: test effectuant un appel réel à l'API Gemini",
    "index: test nécessitant le modèle d'embedding et un index Chroma (lent)",
]
addopts = "-m 'not reseau'"
